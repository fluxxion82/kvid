# XcodeGen spec for the kvid notes iOS app. Generate the Xcode project with:
#   cd kvid-sample/iosApp && xcodegen generate
# The build phase compiles the shared Kotlin framework through Gradle.
name: KvidNotes
options:
  bundleIdPrefix: com.kvid
  # Compose Multiplatform 1.12 links ICU data built for iOS 18.5. Raise the sample's minimum to match
  # until an older runtime is validated; the kvid-core library keeps its own, lower target.
  deploymentTarget:
    iOS: "18.5"
targets:
  KvidNotes:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: kvid notes
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kvid.notes
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework KvidSample"
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :kvid-sample:shared:embedAndSignAppleFrameworkForXcode
