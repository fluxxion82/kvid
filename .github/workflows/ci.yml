name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-document-policy:
    name: Main excludes planning docs
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked docs on main or its proposed merge tree
        run: |
          if [ -n "$(git ls-files -- docs/)" ]; then
            echo "::error::Remove tracked docs/ files from the main integration branch. Keep planning docs on feature/phase branches."
            exit 1
          fi

  jvm-and-android:
    name: JVM + Android (host) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install ffmpeg (JVM video encoder/decoder)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
      - name: Examples compile
        run: ./gradlew :kvid-examples:compileKotlin --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: |
            kvid-core/build/reports/tests
            kvid-storage-spike/build/reports/tests

  ios:
    name: iOS simulator tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Simulator tests
        env:
          # Explicit quarantine of the known Core Image simulator defect.
          # Local rendering tests remain enabled unless this opt-out is set.
          KVID_SKIP_IOS_QR_RENDERING_TESTS: 'true'
        run: ./gradlew :kvid-core:iosSimulatorArm64Test :kvid-storage-spike:iosSimulatorArm64Test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-reports
          path: |
            kvid-core/build/reports/tests
            kvid-storage-spike/build/reports/tests
