name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-and-android:
    name: JVM + Android (host) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install ffmpeg (JVM video encoder/decoder)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
      - name: Examples compile
        run: ./gradlew :kvid-examples:compileKotlin --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: kvid-core/build/reports/tests

  ios:
    name: iOS simulator tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Simulator tests
        run: ./gradlew :kvid-core:iosSimulatorArm64Test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-reports
          path: kvid-core/build/reports/tests
