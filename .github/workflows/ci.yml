name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-document-policy:
    name: Main excludes planning docs
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked docs on main or its proposed merge tree
        run: |
          if [ -n "$(git ls-files -- docs/)" ]; then
            echo "::error::Remove tracked docs/ files from the main integration branch. Keep planning docs on feature/phase branches."
            exit 1
          fi

  jvm-and-android:
    name: JVM + Android (host) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install ffmpeg (JVM video encoder/decoder)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the pinned model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kvid/models
          key: kvid-model-${{ hashFiles('kvid-embed-onnx/scripts/model-pins.json') }}
      - name: Model and reference fixtures (Hugging Face tokenizers, Python ONNX Runtime)
        # Hugging Face reference for tokenizer and embedding parity (ADR 0002): bge-small-en-v1.5 at the
        # revision and SHA-256 digests pinned in kvid-embed-onnx/scripts/model-pins.json. download_model.py
        # verifies every digest, also after a cache restore. The parity tests are required wherever these
        # fixtures are produced.
        run: |
          python -m pip install --quiet -r kvid-embed-onnx/scripts/requirements.txt
          MODEL_DIR="$HOME/.cache/kvid/models/bge-small-en-v1.5"
          REVISION=$(python -I -c 'import json; print(json.load(open("kvid-embed-onnx/scripts/model-pins.json"))["revision"])')
          python -I kvid-embed-onnx/scripts/download_model.py "$MODEL_DIR"
          python -I kvid-embed-onnx/scripts/make_tokenizer_fixture.py "$RUNNER_TEMP/tokenizer-fixture" \
            --tokenizer-json "$MODEL_DIR/tokenizer.json" --vocab "$MODEL_DIR/vocab.txt" --revision "$REVISION"
          python -I kvid-embed-onnx/scripts/make_embedding_fixture.py "$RUNNER_TEMP/embedding-fixture" --model-dir "$MODEL_DIR"
          {
            echo "KVID_TOKENIZER_FIXTURE_DIR=$RUNNER_TEMP/tokenizer-fixture"
            echo "KVID_REQUIRE_TOKENIZER_FIXTURE=true"
            echo "KVID_EMBEDDING_FIXTURE_DIR=$RUNNER_TEMP/embedding-fixture"
            echo "KVID_REQUIRE_EMBEDDING_FIXTURE=true"
            echo "KVID_EMBEDDING_MEASURE=true"
          } >> "$GITHUB_ENV"
      - name: Save the pinned model
        # Saved right after verification, so a later failing step does not lose the download.
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kvid/models
          key: kvid-model-${{ hashFiles('kvid-embed-onnx/scripts/model-pins.json') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
      - name: Examples compile
        run: ./gradlew :kvid-examples:compileKotlin --no-daemon
      - name: Verify parity and measurement tests ran
        # The JUnit results are the gate; the [kvid-*] lines are copied into the log for the roadmap.
        run: |
          results=kvid-embed-onnx/build/test-results/jvmTest
          grep -ho '\[kvid-[a-z-]*\][^<]*' "$results"/*.xml || echo "no [kvid-*] lines"
          python3 -I scripts/verify_device_tests.py --glob '{module}/build/test-results/jvmTest/*.xml' --module kvid-embed-onnx \
            --require kvid-embed-onnx:com.kvid.embed.BertTokenizerParityTest \
            --require kvid-embed-onnx:com.kvid.embed.OnnxEmbedderParityTest \
            --require kvid-embed-onnx:com.kvid.embed.OnnxEmbedderTest \
            --require kvid-embed-onnx:com.kvid.embed.OnnxEmbedderStoreTest \
            --require kvid-embed-onnx:com.kvid.embed.OnnxEmbedderMeasurementTest
          grep -qF '[kvid-tokenizer] cases=' "$results"/TEST-com.kvid.embed.BertTokenizerParityTest.xml
          grep -qF '[kvid-embedding] cases=' "$results"/TEST-com.kvid.embed.OnnxEmbedderParityTest.xml
          grep -qF '[kvid-embedding-measure]' "$results"/TEST-com.kvid.embed.OnnxEmbedderMeasurementTest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: |
            kvid-core/build/reports/tests
            kvid-sample/shared/build/reports/tests
            kvid-embed-onnx/build/reports/tests
            kvid-embed-onnx/build/test-results/jvmTest

  android-store:
    name: Android store (API 35 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # The runner executes each script line separately. Device stdout goes to logcat, not Gradle,
          # so the second line copies the search measurement line into the job log. The last two lines
          # install the notes sample and check the store lifecycle in the running app. The embedding
          # module's device tests run in the android-embed job.
          script: |
            ./gradlew :kvid-core:connectedAndroidDeviceTest -Pandroid.testInstrumentationRunnerArguments.package=com.kvid.store --no-daemon --stacktrace
            adb logcat -d | grep -F "[kvid-measure]" || echo "no [kvid-measure] line in logcat"
            ./gradlew :kvid-sample:androidApp:installDebug --no-daemon --stacktrace
            bash kvid-sample/androidApp/smoke-test.sh
      - name: Verify device tests ran
        # The device-test task does not print counts or failing test names and passes with zero tests,
        # so count the JUnit results here and list failures. Runs after a failed test run as well.
        if: always()
        run: python3 -I scripts/verify_device_tests.py --module kvid-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-store-test-reports
          path: |
            kvid-core/build/reports/androidTests
            kvid-core/build/outputs/androidTest-results

  android-embed:
    name: Android embedding (API 35 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Instrumentation arguments: the device has no host environment, so fixture locations and the
      # required flags reach the tests this way (see kvid-embed-onnx/build.gradle.kts).
      FIXTURE_ARGS: >-
        -Pkvid.deviceTestAbi=x86_64
        -Pandroid.testInstrumentationRunnerArguments.KVID_TOKENIZER_FIXTURE_DIR=/data/local/tmp/kvid-tokenizer-fixture
        -Pandroid.testInstrumentationRunnerArguments.KVID_REQUIRE_TOKENIZER_FIXTURE=true
        -Pandroid.testInstrumentationRunnerArguments.KVID_EMBEDDING_FIXTURE_DIR=/data/local/tmp/kvid-embedding-fixture
        -Pandroid.testInstrumentationRunnerArguments.KVID_REQUIRE_EMBEDDING_FIXTURE=true
      MEASURE_ARGS: >-
        -Pandroid.testInstrumentationRunnerArguments.class=com.kvid.embed.OnnxEmbedderMeasurementTest
        -Pandroid.testInstrumentationRunnerArguments.KVID_EMBEDDING_MEASURE=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the pinned model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kvid/models
          key: kvid-model-${{ hashFiles('kvid-embed-onnx/scripts/model-pins.json') }}
      - name: Model and reference fixtures (Hugging Face tokenizers, Python ONNX Runtime)
        run: |
          python -m pip install --quiet -r kvid-embed-onnx/scripts/requirements.txt
          MODEL_DIR="$HOME/.cache/kvid/models/bge-small-en-v1.5"
          REVISION=$(python -I -c 'import json; print(json.load(open("kvid-embed-onnx/scripts/model-pins.json"))["revision"])')
          python -I kvid-embed-onnx/scripts/download_model.py "$MODEL_DIR"
          python -I kvid-embed-onnx/scripts/make_tokenizer_fixture.py "$RUNNER_TEMP/tokenizer-fixture" \
            --tokenizer-json "$MODEL_DIR/tokenizer.json" --vocab "$MODEL_DIR/vocab.txt" --revision "$REVISION"
          python -I kvid-embed-onnx/scripts/make_embedding_fixture.py "$RUNNER_TEMP/embedding-fixture" --model-dir "$MODEL_DIR"
          echo "KVID_DEVICE_TESTS_SINCE=$(date +%s)" >> "$GITHUB_ENV"
      - name: Save the pinned model
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kvid/models
          key: kvid-model-${{ hashFiles('kvid-embed-onnx/scripts/model-pins.json') }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 6G
          # Each line runs separately. The fixtures (the embedding one holds the 133 MB model) are pushed
          # and passed as instrumentation arguments. The JUnit results of each run are the gate: the
          # verifier requires every parity, lifecycle and telemetry class to have run without skips,
          # before the measurement run replaces the results directory. That run is separate so earlier
          # tests do not inflate the process memory it reports. Logcat lines are copied for the roadmap.
          script: |
            adb logcat -G 16M
            adb push "$RUNNER_TEMP/tokenizer-fixture" /data/local/tmp/kvid-tokenizer-fixture
            adb push "$RUNNER_TEMP/embedding-fixture" /data/local/tmp/kvid-embedding-fixture
            adb logcat -c
            ./gradlew :kvid-embed-onnx:connectedAndroidDeviceTest $FIXTURE_ARGS --no-daemon --stacktrace
            adb logcat -d -s System.out | grep -E "\[kvid-(tokenizer|embedding)\]" || echo "no [kvid-tokenizer]/[kvid-embedding] line in logcat"
            python3 -I scripts/verify_device_tests.py --module kvid-embed-onnx --since "$KVID_DEVICE_TESTS_SINCE" --require kvid-embed-onnx:com.kvid.embed.BertTokenizerParityTest --require kvid-embed-onnx:com.kvid.embed.OnnxEmbedderParityTest --require kvid-embed-onnx:com.kvid.embed.OnnxEmbedderTest --require kvid-embed-onnx:com.kvid.embed.OnnxEmbedderStoreTest --require kvid-embed-onnx:com.kvid.embed.TelemetryProviderTest
            cp -R kvid-embed-onnx/build/outputs/androidTest-results "$RUNNER_TEMP/embed-device-results"
            adb logcat -c
            ./gradlew :kvid-embed-onnx:connectedAndroidDeviceTest $FIXTURE_ARGS $MEASURE_ARGS --no-daemon --stacktrace
            adb logcat -d -s System.out | grep -F "[kvid-embedding-measure]"
            python3 -I scripts/verify_device_tests.py --module kvid-embed-onnx --require kvid-embed-onnx:com.kvid.embed.OnnxEmbedderMeasurementTest
      - name: List device test failures
        # The device-test task does not print failing test names; a failed run stops the script above.
        if: failure()
        run: python3 -I scripts/verify_device_tests.py --module kvid-embed-onnx || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-embed-test-reports
          path: |
            ${{ runner.temp }}/embed-device-results
            kvid-embed-onnx/build/reports/androidTests
            kvid-embed-onnx/build/outputs/androidTest-results

  ios:
    name: iOS simulator tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the pinned model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kvid/models
          key: kvid-model-${{ hashFiles('kvid-embed-onnx/scripts/model-pins.json') }}
      - name: Restore the pinned ONNX Runtime for iOS
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kvid/runtime
          key: kvid-runtime-ios-${{ hashFiles('kvid-embed-onnx/scripts/runtime-pins.json') }}
      - name: Model and reference fixtures
        # The same check-local.sh parts as on a developer's Mac: the Python environment, the pinned model
        # (digests verified after every restore) and the tokenizer and embedding fixtures.
        run: KVID_PYTHON=python3 bash scripts/check-local.sh --only python,fixtures
      - name: Save the pinned model
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kvid/models
          key: kvid-model-${{ hashFiles('kvid-embed-onnx/scripts/model-pins.json') }}
      - name: Download and verify the ONNX Runtime archive
        run: ./gradlew :kvid-embed-onnx:verifyOnnxRuntimeIos --no-daemon --stacktrace
      - name: Save the pinned ONNX Runtime for iOS
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kvid/runtime
          key: kvid-runtime-ios-${{ hashFiles('kvid-embed-onnx/scripts/runtime-pins.json') }}
      - name: Simulator tests, parity and measurements
        # check-local.sh's ios part, gated on fresh JUnit XML per class: kvid-core's simulator tests and
        # optimized search measurement (the known Core Image QR rendering defect is quarantined there with
        # KVID_SKIP_IOS_QR_RENDERING_TESTS), the kvid-embed-onnx tests with both fixtures required
        # (tokenizer and embedding parity, lifecycle, store, measurement), the four telemetry-policy runs
        # (each a fresh simulator process), one tuning configuration, the optimized embedding measurement,
        # and the sample's shared tests.
        run: bash scripts/check-local.sh --only ios
      - name: Build the iOS sample app
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install xcodegen
          cd kvid-sample/iosApp
          xcodegen generate
          xcodebuild -project KvidNotes.xcodeproj -target KvidNotes -configuration Debug -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Run the iOS sample app
        run: bash kvid-sample/iosApp/smoke-test.sh kvid-sample/iosApp/build/Debug-iphonesimulator/KvidNotes.app
      - name: Package kvid-core (Maven staging repository and XCFramework)
        # macOS is the only runner that builds every target, so the full publication is checked here.
        run: |
          ./gradlew :kvid-core:publishAllPublicationsToStagingRepository :kvid-core:assembleKvidCoreReleaseXCFramework --no-daemon --stacktrace
          echo "Staged publications:"
          find kvid-core/build/staging-repo -name "*.pom" | sed 's|kvid-core/build/staging-repo/||' | sort
          GROUP_PATH=$(awk -F= '$1 == "group" { print $2 }' gradle.properties | tr . /)
          for target in jvm android iosarm64 iossimulatorarm64; do
            ls kvid-core/build/staging-repo/$GROUP_PATH/kvid-core-$target/*/*.pom > /dev/null || { echo "::error::missing $target publication"; exit 1; }
          done
          bash kvid-core/scripts/check-publication.sh
          echo "XCFramework slices:"
          ls kvid-core/build/XCFrameworks/release/KvidCore.xcframework
          plutil -p kvid-core/build/XCFrameworks/release/KvidCore.xcframework/Info.plist | grep -E "LibraryIdentifier|SupportedPlatformVariant" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-reports
          path: |
            kvid-core/build/reports/tests
            kvid-sample/shared/build/reports/tests
            kvid-embed-onnx/build/reports/tests
            kvid-embed-onnx/build/test-results
            build/check-local/*.log
